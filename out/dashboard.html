to at Zuora", "url": "https://trino.io/blog/2020/06/16/presto-summit-zuora.html", "age": "2246d", "published_at": "2020-06-16T00:00:00+00:00", "score": 0.0, "score_why": "src:1 kw:-0.8 rec:0.00 [webinar(-0.8)]", "summary": null, "state": "new", "is_primary": true, "cluster_size": 1, "snippet": "The Presto Summit is morphing into a series of virtual events, and we already started with the State of Presto webinar recently. Next up is a talk about Presto with lots of practic\u2026"}, {"id": "8fd42b252224", "source_id": "trino-blog", "type": "rss", "title": "Dynamic partition pruning", "url": "https://trino.io/blog/2020/06/14/dynamic-partition-pruning.html", "age": "2248d", "published_at": "2020-06-14T00:00:00+00:00", "score": 0.0, "score_why": "src:1 kw:+0 rec:0.00", "summary": null, "state": "new", "is_primary": true, "cluster_size": 1, "snippet": "Star-schema is one of the most widely used data mart patterns. The star schema consists of fact tables (usually partitioned) and dimension tables, which are used to filter rows fro\u2026"}, {"id": "d57e7ca5b912", "source_id": "trino-blog", "type": "rss", "title": "Hive ACID and transactional tables' support in Presto", "url": "https://trino.io/blog/2020/06/01/hive-acid.html", "age": "2261d", "published_at": "2020-06-01T00:00:00+00:00", "score": 0.0, "score_why": "src:1 kw:+0 rec:0.00", "summary": null, "state": "new", "is_primary": true, "cluster_size": 1, "snippet": "Hive ACID and transactional tables are supported in Presto since the 331 release. Hive ACID support is an important step towards GDPR/CCPA compliance, and also towards Hive 3 suppo\u2026"}, {"id": "728da4dc3b7b", "source_id": "trino-blog", "type": "rss", "title": "Apache Pinot Connector", "url": "https://trino.io/blog/2020/05/25/pinot-connector.html", "age": "2268d", "published_at": "2020-05-25T00:00:00+00:00", "score": 0.0, "score_why": "src:1 kw:+0 rec:0.00", "summary": null, "state": "new", "is_primary": true, "cluster_size": 1, "snippet": "Presto 334 introduces the new Pinot Connector which allows Presto to query data stored in Apache Pinot\u2122. Not only does this allow access to Pinot tables but gives users the ability\u2026"}, {"id": "507b51334dca", "source_id": "trino-blog", "type": "rss", "title": "State of Presto", "url": "https://trino.io/blog/2020/05/15/state-of-presto.html", "age": "2278d", "published_at": "2020-05-15T00:00:00+00:00", "score": 0.0, "score_why": "src:1 kw:-0.8 rec:0.00 [webinar(-0.8)]", "summary": null, "state": "new", "is_primary": true, "cluster_size": 1, "snippet": "Presto is continuing to gain adoption across many industries and use cases. Our community is growing rapidly and there is a lot going on, so we are taking the Presto Summit online.\u2026"}, {"id": "71fa8ca8977f", "source_id": "trino-blog", "type": "rss", "title": "Presto on FLOSS Weekly", "url": "https://trino.io/blog/2020/05/06/floss-weekly.html", "age": "2287d", "published_at": "2020-05-06T00:00:00+00:00", "score": 0.0, "score_why": "src:1 kw:+0 rec:0.00", "summary": null, "state": "new", "is_primary": true, "cluster_size": 1, "snippet": "Spreading the word about our project is an important task to grow the community around Presto. With a large, lively community we can ensure the success of Presto. Today we had the \u2026"}, {"id": "734e1a7993e9", "source_id": "trino-blog", "type": "rss", "title": "Presto: The Definitive Guide", "url": "https://trino.io/blog/2020/04/11/the-definitive-guide.html", "age": "2312d", "published_at": "2020-04-11T00:00:00+00:00", "score": 0.0, "score_why": "src:1 kw:+0 rec:0.00", "summary": null, "state": "new", "is_primary": true, "cluster_size": 1, "snippet": "Nearly two years ago Matt and Martin got the ball rolling on getting a book about Presto happening. A thriving project and community like everyone around Dain, David and Martin, th\u2026"}, {"id": "49d673026f93", "source_id": "trino-blog", "type": "rss", "title": "Beyond LIMIT, Presto meets OFFSET and TIES", "url": "https://trino.io/blog/20 ce types powered by Arm-based AWS Graviton2 Processor. M6g, C6g, and R6g are designed to deliver up to 40% improved price/performance compare\u2026"}, {"id": "8b9dea6e9421", "source_id": "trino-blog", "type": "rss", "title": "First Presto Summit in India, Bangalore, September 2019", "url": "https://trino.io/blog/2019/09/05/Presto-Summit-Bangalore.html", "age": "2531d", "published_at": "2019-09-05T00:00:00+00:00", "score": 0.0, "score_why": "src:1 kw:+0 rec:0.00", "summary": null, "state": "new", "is_primary": true, "cluster_size": 1, "snippet": "Qubole organized the first ever Presto Summit in India on September 05, 2019. Bangalore, as the technology and startup hub of India was the perfect venue for India\u2019s first Presto S\u2026"}, {"id": "dfec61199fd5", "source_id": "trino-blog", "type": "rss", "title": "Unnest Operator Performance Enhancement with Dictionary Blocks", "url": "https://trino.io/blog/2019/08/23/unnest-operator-performance-enhancements.html", "age": "2544d", "published_at": "2019-08-23T00:00:00+00:00", "score": 0.0, "score_why": "src:1 kw:+0 rec:0.00", "summary": null, "state": "new", "is_primary": true, "cluster_size": 1, "snippet": "Queries with CROSS JOIN UNNEST clause are expected to have a significant performance improvement starting version 316."}, {"id": "3320b5e66a9c", "source_id": "trino-blog", "type": "rss", "title": "A Report of First Ever Presto Conference Tokyo", "url": "https://trino.io/blog/2019/07/11/report-for-presto-conference-tokyo.html", "age": "2587d", "published_at": "2019-07-11T00:00:00+00:00", "score": 0.0, "score_why": "src:1 kw:+0 rec:0.00", "summary": null, "state": "new", "is_primary": true, "cluster_size": 1, "snippet": "Nowadays, Presto is getting much attraction from the various kind of companies all around the world. Japan is not an exception. Many companies are using Presto as their primary dat\u2026"}, {"id": "37d28428574b", "source_id": "trino-blog", "type": "rss", "title": "Introduction to Trino Cost-Based Optimizer", "url": "https://trino.io/blog/2019/07/04/cbo-introduction.html", "age": "2594d", "published_at": "2019-07-04T00:00:00+00:00", "score": 0.0, "score_why": "src:1 kw:+1.5 rec:0.00 [trino(+1),benchmark(+0.5)]", "summary": null, "state": "new", "is_primary": true, "cluster_size": 1, "snippet": "Last edited 15 June 2022: Update to use the Trino project name. The Cost-Based Optimizer (CBO) in Trino achieves stunning results in industry standard benchmarks (and not only in b\u2026"}, {"id": "f994f381cd0f", "source_id": "trino-blog", "type": "rss", "title": "Dynamic filtering for highly-selective join optimization", "url": "https://trino.io/blog/2019/06/30/dynamic-filtering.html", "age": "2598d", "published_at": "2019-06-30T00:00:00+00:00", "score": 0.0, "score_why": "src:1 kw:+0 rec:0.00", "summary": null, "state": "new", "is_primary": true, "cluster_size": 1, "snippet": "By using dynamic filtering via run-time predicate pushdown, we can significantly optimize highly-selective inner-joins."}, {"id": "ef8bc1aa7d4f", "source_id": "trino-blog", "type": "rss", "title": "Release 315", "url": "https://trino.io/blog/2019/06/15/release-315.html", "age": "2613d", "published_at": "2019-06-15T00:00:00+00:00", "score": 0.0, "score_why": "src:1 kw:+0 rec:0.00", "summary": null, "state": "new", "is_primary": true, "cluster_size": 1, "snippet": "This version adds support for FETCH FIRST ... WITH TIES syntax, locality-awareness to default scheduler for better workload balancing, the new format() function, and improved suppo\u2026"}, {"id": "6fbac98b4e27", "source_id": "trino-blog", "type": "rss", "title": "Release 314", "url": "https://trino.io/blog/2019/06/08/release-314.html", "age": "2620d", "published_at": "2019-06-08T00:00:00+00:00", "score": 0.0, "score_why": "src:1 kw:+0 rec:0.00", "summary": null, "state": "new", "is_primary": true, "cluster_size": 1, "snippet": "This version adds support for reading ZSTD and LZ4-compressed Parquet data and writing ZSTD-compressed ORC data, improves compatibility with the Hive 2.3+ metastore, supports mixed\u2026"}, {"id": "30414530c82d", "source_id": "trino-blog", "type": "rss", "title": "Apache Phoenix Connector", "url": "https://trino.io/blog/2019/06/04/phoenix-connector.html", "age": "2624d", "published_at": "2019-06-04T00:00:00+00:00", "score": 0.0, "score_why": "src:1 kw:+0 rec:0.00", "summary": null, "state": "new", "is_primary": true, "cluster_size": 1, "snippet": "Presto 312 introduces a new Apache Phoenix Connector, which allows Presto to query data stored in HBase using Apache Phoenix. This unlocks new capabilities that previously weren\u2019t \u2026"}, {"id": "24afdcd65693", "source_id": "trino-blog", "type": "rss", "title": "Removing redundant ORDER BY", "url": "https://trino.io/blog/2019/06/03/redundant-order-by.html", "age": "2625d", "published_at": "2019-06-03T00:00:00+00:00", "score": 0.0, "score_why": "src:1 kw:+0 rec:0.00", "summary": null, "state": "new", "is_primary": true, "cluster_size": 1, "snippet": "Optimizers are all about doing work in the most cost-effective manner and avoiding unnecessary work. Some SQL constructs such as ORDER BY do not affect query results in many situat\u2026"}, {"id": "d93438582a33", "source_id": "trino-blog", "type": "rss", "title": "Release 313", "url": "https://trino.io/blog/2019/06/01/release-313.html", "age": "2627d", "published_at": "2019-06-01T00:00:00+00:00", "score": 0.0, "score_why": "src:1 kw:+0 rec:0.00", "summary": null, "state": "new", "is_primary": true, "cluster_size": 1, "snippet": "This version fixes incorrect results for queries involving GROUPING SETS and LIMIT, fixes selecting the UUID type from the CLI and JDBC driver, and adds support for compression and\u2026"}, {"id": "9a561e6be786", "source_id": "trino-blog", "type": "rss", "title": "Using Precomputed Hash in SemiJoin Operations", "url": "https://trino.io/blog/2019/05/30/semijoin-precomputed-hasd.html", "age": "2629d", "published_at": "2019-05-30T00:00:00+00:00", "score": 0.0, "score_why": "src:1 kw:+0 rec:0.00", "summary": null, "state": "new", "is_primary": true, "cluster_size": 1, "snippet": "Queries involving IN and NOT IN over a subquery are much faster in Presto 312."}, {"id": "d41c403bd143", "source_id": "trino-blog", "type": "rss", "title": "Release 312", "url": "https://trino.io/blog/2019/05/29/release-312.html", "age": "2630d", "published_at": "2019-05-29T00:00:00+00:00", "score": 0.0, "score_why": "src:1 kw:+0 rec:0.00", "summary": null, "state": "new", "is_primary": true, "cluster_size": 1, "snippet": "This version has many performance improvements (including cast optimization), a new UUID data type and uuid() function, a new Apache Phoenix connector, support for the PostgreSQL T\u2026"}, {"id": "b1fed7a7dddd", "source_id": "trino-blog", "type": "rss", "title": "Improved Hive Bucketing", "url": "https://trino.io/blog/2019/05/29/improved-hive-bucketing.html", "age": "2630d", "published_at": "2019-05-29T00:00:00+00:00", "score": 0.0, "score_why": "src:1 kw:+0 rec:0.00", "summary": null, "state": "new", "is_primary": true, "cluster_size": 1, "snippet": "Presto 312 adds support for the more flexible bucketing introduced in recent versions of Hive. Specifically, it allows any number of files per bucket, including zero. This allows i\u2026"}, {"id": "a0e5fea22a58", "source_id": "trino-blog", "type": "rss", "title": "Optimizing the Casts Away", "url": "https://trino.io/blog/2019/05/21/optimizing-the-casts-away.html", "age": "2638d", "published_at": "2019-05-21T00:00:00+00:00", "score": 0.0, "score_why": "src:1 kw:+0 rec:0.00", "summary": null, "state": "new", "is_primary": true, "cluster_size": 1, "snippet": "The next release of Presto (version 312) will include a new optimization to remove unnecessary casts which might have been added implicitly by the query planner or explicitly by us\u2026"}, {"id": "a99f5b73d07c", "source_id": "trino-blog", "type": "rss", "title": "Presto Summit 2019 @TwitterSF", "url": "https://trino.io/blog/2019/05/17/Presto-Summit.html", "age": "2642d", "published_at": "2019-05-17T00:00:00+00:00", "score": 0.0, "score_why": "src:1 kw:+0 rec:0.00", "summary": null, "state": "new", "is_primary": true, "cluster_size": 1, "snippet": "Next month will mark the 2nd annual Presto Summit hosted by the Presto Software Foundation, Starburst Data, and Twitter. Last year\u2019s event was a great success (see the Presto Summi\u2026"}, {"id": "627e56efa69b", "source_id": "trino-blog", "type": "rss", "title": "Release 311", "url": "https://trino.io/blog/2019/05/15/release-311.html", "age": "2644d", "published_at": "2019-05-15T00:00:00+00:00", "score": 0.0, "score_why": "src:1 kw:+0 rec:0.00", "summary": null, "state": "new", "is_primary": true, "cluster_size": 1, "snippet": "This version adds standard OFFSET syntax, a new function combinations() for computing k-combinations of array elements, and support for nested collections in Cassandra. Release not\u2026"}, {"id": "b030079b41c9", "source_id": "trino-blog", "type": "rss", "title": "Presto Community Meeting 2019-05-08", "url": "https://trino.io/blog/2019/05/08/Presto-Community-Meeting.html", "age": "2651d", "published_at": "2019-05-08T00:00:00+00:00", "score": 0.0, "score_why": "src:1 kw:+0 rec:0.00", "summary": null, "state": "new", "is_primary": true, "cluster_size": 1, "snippet": "Agenda Existing function support Function namespaces Connector-resolved functions SQL-defined functions Remote functions Polymorphic table functions"}, {"id": "e11d4d9fc4d8", "source_id": "trino-blog", "type": "rss", "title": "Faster S3 Reads", "url": "https://trino.io/blog/2019/05/06/faster-s3-reads.html", "age": "2653d", "published_at": "2019-05-06T00:00:00+00:00", "score": 0.0, "score_why": "src:1 kw:+0.5 rec:0.00 [s3(+0.5)]", "summary": null, "state": "new", "is_primary": true, "cluster_size": 1, "snippet": "Presto is known for working well with Amazon S3. We recently made an improvement that greatly reduces network utilization and latency when reading ORC or Parquet data."}, {"id": "d064d80bc98e", "source_id": "trino-blog", "type": "rss", "title": "Release 310", "url": "https://trino.io/blog/2019/05/03/release-310.html", "age": "2656d", "published_at": "2019-05-03T00:00:00+00:00", "score": 0.0, "score_why": "src:1 kw:+1.9 rec:0.00 [aws(+0.8),glue(+0.6),s3(+0.5)]", "summary": null, "state": "new", "is_primary": true, "cluster_size": 1, "snippet": "This version adds standard FETCH FIRST syntax, support for using an alternate AWS role when accessing S3 or Glue, and improved handling of DECIMAL, DOUBLE, and REAL when Hive table\u2026"}, {"id": "ffd382de50da", "source_id": "trino-blog", "type": "rss", "title": "A review of the first international Presto Conference, Tel Aviv, April 2019", "url": "https://trino.io/blog/2019/05/03/Presto-Conference-Israel.html", "age": "2656d", "published_at": "2019-05-03T00:00:00+00:00", "score": 0.0, "score_why": "src:1 kw:+0 rec:0.00", "summary": null, "state": "new", "is_primary": true, "cluster_size": 1, "snippet": "Community, noun: \u201cA feeling of fellowship with others, as a result of sharing common attributes, interests, and goals\u201d The fun picture you see here was taken at the first lecture o\u2026"}, {"id": "b14e53ca0b43", "source_id": "trino-blog", "type": "rss", "title": "Release 309", "url": "https://trino.io/blog/2019/04/25/release-309.html", "age": "2664d", "published_at": "2019-04-25T00:00:00+00:00", "score": 0.0, "score_why": "src:1 kw:+0 rec:0.00", "summary": null, "state": "new", "is_primary": true, "cluster_size": 1, "snippet": "This version adds support for case-insensitive name matching in JDBC-based connectors, more data types in PostgreSQL connector, and some bug fixes. Release notes Download"}, {"id": "dd67dd5cfcdb", "source_id": "trino-blog", "type": "rss", "title": "Even Faster ORC", "url": "https://trino.io/blog/2019/04/23/even-faster-orc.html", "age": "2666d", "published_at": "2019-04-23T00:00:00+00:00", "score": 0.0, "score_why": "src:1 kw:+1 rec:0  capac\u2026", "siblings": [], "score": 2.6198946122136, "tags": ["aws", "dataeng"]}, {"id": "283ca2fdc975e405edbbb0f7ffa916e1cb8f1b42fbc03967645022c958de83fa", "title": "How a team at Epic Games tuned Amazon OpenSearch Service for Fortnite analytics", "url": "https://aws.amazon.com/blogs/big-data/how-a-team-at-epic-games-tuned-amazon-opensearch-service-for-fortnite-analytics", "source_id": "aws-big-data", "source_type": "rss", "age": "2h", "is_new": true, "summary": "Epic Games tunes Amazon OpenSearch cluster for Fortnite analytics queries.", "snippet": "Learn how a team at Epic Games tuned their Amazon OpenSearch Service cluster for Fortnite analytics. This post details how Epic Games partnered with AWS to right-size instances, rebalance shards, opti\u2026", "siblings": [], "score": 1.8891207718957639, "tags": ["aws", "dataeng"]}, {"id": "92e2674f3a7660ae1817e19430392bfb96ae8ed06c6941cd523ccdb8fc91aa75", "title": "AWS Elastic Disaster Recovery now preserves UEFI boot mode for Linux servers", "url": "https://aws.amazon.com/about-aws/whats-new/2026/08/aws-drs-linux-uefi", "source_id": "aws-whats-new", "source_type": "rss", "age": "5h", "is_new": true, "summary": "AWS DRS preserves UEFI boot mode for restored Linux instances.", "snippet": "AWS Elastic Disaster Recovery (AWS DRS) now preserves UEFI boot mode when recovering Linux source servers that boot with UEFI firmware. Previously, DRS launched these Linux servers in legacy BIOS mode\u2026", "siblings": [], "score": 1.6072497527248155, "tags": ["aws", "releases"]}], "summary_html": "AWS Elastic Disaster Recovery now preserves UEFI boot mode for Linux servers during failover, eliminating post-recovery configuration steps <a href=\"https://aws.amazon.com/about-aws/whats-new/2026/08/aws-drs-linux-uefi\" target=\"_blank\" rel=\"noopener\" title=\"aws-whats-new \u2014 AWS Elastic Disaster Recovery now preserves UEFI boot mode for Linux servers\">[1]<\/a>. Additionally, the weekly AWS roundup highlights community gatherings alongside Bedrock web search capabilities <a href=\"https://aws.amazon.com/blogs/aws/aws-weekly-roundup-aws-heroes-summit-web-search-on-amazon-bedrock-dogwood-kiro-crew-and-more-august-10-2026\" target=\"_blank\" rel=\"noopener\" title=\"aws-news \u2014 AWS Weekly Roundup: AWS Heroes Summit, Web Search on Amazon Bedrock, Dogwood, Kiro Crew, and more (August 10, 2026)\">[2]<\/a>."}, {"tag": "dataeng", "entries": [{"id": "b89a3429126ad6b410f8751109cbfcd7fcddddab195254494cb256dd9072c07a", "title": "providers-cncf-kubernetes/10.21.0", "url": "https://airflow.apache.org/docs/apache-airflow-providers-cncf-kubernetes/10.21.0/changelog.html", "source_id": "airflow-releases", "source_type": "github", "age": "3h", "is_new": true, "summary": "Airflow Kubernetes provider adds a default delay before pod cleanup.", "snippet": "10.21.0 \u00b6 Release Date: 2026-08-10 Note airflow kubernetes cleanup-pods now takes --min-completed-minutes , which defaults to 1 . Terminal pods are therefore no longer deleted immediately; pass --min-\u2026", "siblings": [], "score": 2.3626892722565094, "tags": ["dataeng", "releases"]}, {"id": "b1cdeec36d30c56b4a3bac255f1c731ee3288a4d16b9bf0205425ef55cb1dd5e", "title": "providers-google/22.3.0", "url": "https://airflow.apache.org/docs/apache-airflow-providers-google/22.3.0/changelog.html", "source_id": "airflow-releases", "source_type": "github", "age": "3h", "is_new": true, "summary": "Airflow Google provider fixes multi-team secret scope resolution.", "snippet": "22.3.0 \u00b6 Release Date: 2026-08-10 Note CloudSecretManagerBackend now applies the team scope it is given. Previously get_conn_value and get_variable accepted a team_name and dropped it, so every lookup\u2026", "siblings": [], "score": 1.3125981309902928, "tags": ["dataeng", "releases"]}, {"id": "c8664b941a5aed15c94d40bb111fa996327b35fe35b06a892583ac2193cd7369", "title": "constraints-3.3.1rc1", "url": "https://github.com/apache/airflow/releases/tag/constraints-3.3.1rc1", "source_id": "airflow-releases", "source_type": "github", "age": "1d", "is_new": false, "summary": "Constraints update released for Apache Airflow 3.3.1rc1.", "snippet": "Constraints for Apache Airflow 3.3.1rc1", "siblings": [], "score": 1.1949242002706786, "tags": ["dataeng", "releases"]}], "summary_html": "Apache Airflow ecosystem updates bring scoped multi-team secret support to Google Cloud providers <a href=\"https://airflow.apache.org/docs/apache-airflow-providers-google/22.3.0/changelog.html\" target=\"_blank\" rel=\"noopener\" title=\"airflow-releases \u2014 providers-google/22.3.0\">[1]<\/a> and new pod deletion grace periods to Kubernetes providers <a href=\"https://airflow.apache.org/docs/apache-airflow-providers-cncf-kubernetes/10.21.0/changelog.html\" target=\"_blank\" rel=\"noopener\" title=\"airflow-releases \u2014 providers-cncf-kubernetes/10.21.0\">[2]<\/a>, alongside new release constraints <a href=\"https://github.com/apache/airflow/releases/tag/constraints-3.3.1rc1\" target=\"_blank\" rel=\"noopener\" title=\"airflow-releases \u2014 constraints-3.3.1rc1\">[3]<\/a>. Meanwhile, AWS users can optimize Kinesis streaming costs using a Bedrock-powered agent <a href=\"https://aws.amazon.com/blogs/big-data/ai-powered-cost-optimization-agent-for-amazon-kinesis-data-streams\" target=\"_blank\" rel=\"noopener\" title=\"aws-big-data \u2014 AI-powered cost optimization agent for Amazon Kinesis Data Streams\">[4]<\/a> and tune OpenSearch clusters for large-scale telemetry analytics <a href=\"https://aws.amazon.com/blogs/big-data/how-a-team-at-epic-games-tuned-amazon-opensearch-service-for-fortnite-analytics\" target=\"_blank\" rel=\"noopener\" title=\"aws-big-data \u2014 How a team at Epic Games tuned Amazon OpenSearch Service for Fortnite analytics\">[5]<\/a>."}, {"tag": "ai", "entries": [{"id": "1c4d767bb36abf17c32d234f6d5b59b17fe8a9cb1b7e088e9f6af8b2b7b8a7e8", "title": "Quoting Claude Opus 5 system prompt", "url": "https://simonwillison.net/2026/Aug/9/claude-opus-5-system-prompt", "source_id": "simonwillison", "source_type": "rss", "age": "19h", "is_new": true, "summary": "System prompt quotes surface regarding Claude Opus 5 export control history.", "snippet": "Claude Fable 5 and Claude Mythos 5 were first released on June 9, 2026. On June 12, 2026, Anthropic suspended access to both models to comply with U.S. Department of Commerce export controls; the Depa\u2026", "siblings": [], "score": 1.4466846131010718, "tags": ["ai"]}, {"id": "5890b1cfd4cc38aa3885e02e9fc3010d881da63d5d8b82ee82ae0ed7c4531d58", "title": "Build Low-Latency Multilingual Voice Agents: Open Weights & Full Deployment Control with NVIDIA Magpie TTS", "url": "https://huggingface.co/blog/nvidia/magpie-tts-multilingual-voice-agents", "source_id": "huggingface-blog", "source_type": "rss", "age": "2h", "is_new": true, "summary": "NVIDIA releases Magpie TTS for open-weights multilingual voice agents.", "snippet": "", "siblings": [], "score": 1.1159643475840288, "tags": ["ai"]}, {"id": "756be989e03c60bef5a08451f686d9e6537155fbaa81eac6f0e1936daa24f0a8", "title": "Auto mode is now the default in Claude Code for Pro, Max, and Team plans", "url": "https://simonwillison.net/2026/Aug/8/auto-mode", "source_id": "simonwillison", "source_type": "rss", "age": "1d", "is_new": false, "summary": "Claude Code makes Auto mode the default setting across paid plans.", "snippet": "Auto mode is now the default in Claude Code for Pro, Max, and Team plans Anthropic are really confident in Claude Code's auto mode , to the point that they are making it the default setting for new se\u2026", "siblings": [], "score": 0.8952379075791252, "tags": ["ai"]}, {"id": "dfb586131bf3d3cb04b45c447ddda1020a0bfabb4f918d58630b10079556383d", "title": "Meta is back with Muse Glimmer: local, agentic, multimodal, and open source", "url": "https://huggingface.co/blog/muse-glimmer", "source_id": "huggingface-blog", "source_type": "rss", "age": "18h", "is_new": true, "summary": "Meta introduces Muse Glimmer, an open-source local agentic model.", "snippet": "", "siblings": [], "score": 0.8133761767338791, "tags": ["ai"]}, {"id": "815edfe6383208a72cfe7f7d043ea0afc2543b1ffb0ccb04372202c8f4eb8186", "title": "Making Knowledge Distillation Cheap Enough to Run at Scale", "url": "https://huggingface.co/blog/MultiverseComputingCAI/efficient-knowledge-distillation", "source_id": "huggingface-blog", "source_type": "rss", "age": "8h", "is_new": true, "summary": "Research explores cost reduction techniques for knowledge distillation at scale.", "snippet": "", "siblings": [], "score": 0.759885201954436, "tags": ["ai"]}], "summary_html": "Anthropic is setting Auto mode as default in Claude Code <a href=\"https://simonwillison.net/2026/Aug/8/auto-mode\" target=\"_blank\" rel=\"noopener\" title=\"simonwillison \u2014 Auto mode is now the default in Claude Code for Pro, Max, and Team plans\">[1]<\/a> while system prompt details surface around historical Claude model export compliance <a href=\"https://simonwillison.net/2026/Aug/9/claude-opus-5-system-prompt\" target=\"_blank\" rel=\"noopener\" title=\"simonwillison \u2014 Quoting Claude Opus 5 system prompt\">[2]<\/a>. In open-source voice and multimodal AI, NVIDIA introduced Magpie TTS <a href=\"https://huggingface.co/blog/nvidia/magpie-tts-multilingual-voice-agents\" target=\"_blank\" rel=\"noopener\" title=\"huggingface-blog \u2014 Build Low-Latency Multilingual Voice Agents: Open Weights &amp; Full Deployment Control with NVIDIA Magpie TTS\">[3]<\/a> while Meta announced Muse Glimmer for local agentic workflows <a href=\"https://huggingface.co/blog/muse-glimmer\" target=\"_blank\" rel=\"noopener\" title=\"huggingface-blog \u2014 Meta is back with Muse Glimmer: local, agentic, multimodal, and open source\">[4]<\/a>. Finally, new approaches aim to lower costs for performing knowledge distillation at scale <a href=\"https://huggingface.co/blog/MultiverseComputingCAI/efficient-knowledge-distillation\" target=\"_blank\" rel=\"noopener\" title=\"huggingface-blog \u2014 Making Knowledge Distillation Cheap Enough to Run at Scale\">[5]<\/a>."}], "newsletters": [{"id": "55acf7078357bbabb318eb8cb444ffb85d974e5ac65f9766cc3af9e903577fe7", "title": "Data Engineering Weekly #282", "url": "https://mail.google.com/mail/u/0/#search/rfc822msgid%3A%3C20260810012126.3.910cf2062dd5b76c%40mg-d1.substack.com%3E", "source_id": "de-weekly", "source_type": "imap", "age": "17h", "is_new": true, "summary": null, "snippet": "View this post on the web at https://www.dataengineeringweekly.com/p/data-engineering-weekly-282 How to Build a Data Platform From Scratch We wrote an eBook on Data Platform Fundamentals to help you b\u2026", "siblings": [], "score": 1.926718942316194, "tags": ["dataeng", "newsletter"]}], "newsletter_summary_html": null, "dead_feeds": [], "top5": [{"id": "f3d45988ad4f40b649d25b233a83ad71d31a53be98331d6d07eee69574c450d8", "title": "AWS Weekly Roundup: AWS Heroes Summit, Web Search on Amazon Bedrock, Dogwood, Kiro Crew, and more (August 10, 2026)", "url": "https://aws.amazon.com/blogs/aws/aws-weekly-roundup-aws-heroes-summit-web-search-on-amazon-bedrock-dogwood-kiro-crew-and-more-august-10-2026", "source_id": "aws-news", "source_type": "rss", "age": "3h", "is_new": true, "summary": "AWS weekly roundup covers Bedrock web search and community summit.", "snippet": "Last week, we brought together AWS Heroes from around the world to connect, collaborate, and celebrate the builders who go above and beyond for the AWS community. The AWS Heroes Summit, an invite-only\u2026", "siblings": [], "score": 2.8244535209913244, "tags": ["aws"]}, {"id": "d534eb2cc8a9df63509f19f94c5a56fe46b4562734eaef8886899ccc295641a4", "title": "AI-powered cost optimization agent for Amazon Kinesis Data Streams", "url": "https://aws.amazon.com/blogs/big-data/ai-powered-cost-optimization-agent-for-amazon-kinesis-data-streams", "source_id": "aws-big-data", "source_type": "rss", "age": "2h", "is_new": true, "summary": "Open-source Bedrock agent c function setTheme(t){root.setAttribute("data-theme",t);try{localStorage.setItem("pdt-theme",t);}catch(e){}drawAll();}
$("#themeBtn").addEventListener("click",()=>setTheme(currentTheme()==="dark"?"light":"dark"));
try{const s=localStorage.getItem("pdt-theme");if(s)root.setAttribute("data-theme",s);}catch(e){}

/* ---- charts ---- */
function accent(){return getComputedStyle(root).getPropertyValue("--accent").trim()||"#38cdf0";}
function areaChart(vals,w=260,h=52,pad=4){
  if(!vals||!vals.length) return "";
  if(vals.length===1){const cy=h/2;return `<svg viewBox="0 0 ${w} ${h}" preserveAspectRatio="none"><line x1="${pad}" y1="${cy}" x2="${w-pad}" y2="${cy}" stroke="var(--grid)" stroke-width="1"/><circle cx="${w-pad}" cy="${cy}" r="3.5" fill="${accent()}"/></svg>`;}
  const lo=Math.min(...vals),hi=Math.max(...vals),span=(hi-lo)||1,n=vals.length;
  const X=i=>pad+(w-2*pad)*(i/(n-1));
  const Y=v=>pad+(h-2*pad)*(1-(v-lo)/span);
  let line=vals.map((v,i)=>`${X(i).toFixed(1)},${Y(v).toFixed(1)}`).join(" ");
  let area=`${pad},${h-pad} `+line+` ${w-pad},${h-pad}`;
  const ex=X(n-1).toFixed(1),ey=Y(vals[n-1]).toFixed(1);
  const gid="g"+Math.round(X(0)+hi);
  return `<svg viewBox="0 0 ${w} ${h}" preserveAspectRatio="none">
    <defs><linearGradient id="${gid}" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="${accent()}" stop-opacity="0.22"/>
      <stop offset="1" stop-color="${accent()}" stop-opacity="0"/></linearGradient></defs>
    <line x1="${pad}" y1="${(h-pad).toFixed(1)}" x2="${w-pad}" y2="${(h-pad).toFixed(1)}" stroke="var(--grid)" stroke-width="1"/>
    <polygon points="${area}" fill="url(#${gid})"/>
    <polyline points="${line}" fill="none" stroke="${accent()}" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="${ex}" cy="${ey}" r="3.2" fill="${accent()}"/></svg>`;
}

/* ---- header / pipeline / summary ---- */
function drawHeader(){$("#gen").textContent="snapshot · "+DATA.generated;$("#foot-gen").textContent=DATA.generated;}
function drawPipeline(){
  $("#pipeline").innerHTML = DATA.pipeline.map(s=>`
    <div class="stage">
      <span class="dot"></span>
      <span class="st-label">${esc(s.label)}</span>
      <span class="st-value ${typeof s.value==="string"?"text":""}">${esc(s.value)}</span>
      <span class="st-sub">${esc(s.sub)}</span>
    </div>`).join("");
}
function drawSummary(){
  const s=DATA.summary;
  const cards=[
    {l:"Items",v:s.items_total,sub:`${s.new} new · ${s.digested} digested`},
    {l:"Sources",v:s.sources_total,sub:`${s.sources_ok} ok`},
    {l:"Dead feeds",v:s.sources_dead,sub:s.sources_dead?"needs attention":"all healthy",crit:s.sources_dead>0},
    {l:"Merged clusters",v:s.clusters_merged,sub:"near-duplicates"},
    {l:"Trackers",v:s.metrics_tracked,sub:"live metrics"},
  ];
  $("#summary").innerHTML=cards.map(c=>`
    <div class="card ${c.crit?"crit":""}">
      <div class="c-label">${esc(c.l)}</div>
      <div class="c-value">${esc(c.v)}</div>
      <div class="c-sub">${esc(c.sub)}</div>
    </div>`).join("");
}
function drawTrackers(){
  const g=$("#trackers");
  if(!DATA.metrics.length){g.innerHTML='<div class="empty">No metrics yet — run fetch_metrics.</div>';return;}
  g.innerHTML=DATA.metrics.map(m=>{
    const lbl=m.link?`<a class="tk-link" href="${esc(m.link)}" target="_blank" rel="noopener" title="Larger time window">${esc(m.label)} ↗</a>`:esc(m.label);
    const delta = (m.delta && m.delta.dir!=='flat') ? ` <span class="tk-delta">${m.delta.arrow}${esc(m.delta.pct)}</span>` : '';
    const band = m.band ? `<div class="tk-band"><span class="tk-dot" style="background:${esc(m.band.color)}"></span>${esc(m.band.label)}</div>` : '';
    return `
    <div class="tk">
      <div class="tk-top"><span class="tk-label">${lbl}</span><span class="tk-n">${m.n} pt${m.n>1?"s":""}</span></div>
      <div class="tk-value">${esc(m.latest)}${delta}</div>
      ${band}
      ${areaChart(m.points)}
    </div>`;}).join("");
}

/* ---- tabs ---- */
const TABS=[
  {k:"items",l:"Items",c:()=>DATA.items.length},
  {k:"sources",l:"Sources",c:()=>DATA.sources.length},
  {k:"digest",l:"Digest",c:()=>DATA.digest.counts.news+DATA.digest.counts.newsletters},
  {k:"clusters",l:"Clusters",c:()=>DATA.clusters.length},
  {k:"scoring",l:"Scoring",c:()=>DATA.scoring.keywords.length},
];
let activeTab="items";
function drawTabs(){
  $("#tabs").innerHTML=TABS.map(t=>`<button class="tab" role="tab" data-k="${t.k}"
     aria-selected="${t.k===activeTab}">${esc(t.l)} <span class="cnt">${t.c()}</span></button>`).join("");
  $("#tabs").querySelectorAll(".tab").forEach(b=>b.addEventListener("click",()=>{activeTab=b.dataset.k;drawTabs();drawPanel();}));
}
function drawPanel(){({items:panelItems,sources:panelSources,digest:panelDigest,clusters:panelClusters,scoring:panelScoring})[activeTab]();}

/* ---- items ---- */
let itemState={q:"",type:"",state:"",source:"",sort:"score"};
const maxScore=Math.max(1e-9,...DATA.items.map(i=>i.score||0));
function panelItems(){
  const sources=[...new Set(DATA.items.map(i=>i.source_id))].sort();
  const types=[...new Set(DATA.items.map(i=>i.type))].sort();
  const states=[...new Set(DATA.items.map(i=>i.state))].sort();
  $("#panel").innerHTML=`
    <div class="toolbar">
      <input id="q" type="search" placeholder="Search title, source, or score reason…" value="${esc(itemState.q)}">
      <select id="f-type"><option value="">all types</option>${types.map(t=>`<option ${t===itemState.type?"selected":""}>${t}</option>`).join("")}</select>
      <select id="f-state"><option value="">any state</option>${states.map(t=>`<option ${t===itemState.state?"selected":""}>${t}</option>`).join("")}</select>
      <select id="f-source"><option value="">all sources</option>${sources.map(t=>`<option ${t===itemState.source?"selected":""}>${t}</option>`).join("")}</select>
      <select id="f-sort">
        <option value="score" ${itemState.sort==="score"?"selected":""}>sort: score ↓</option>
        <option value="score-asc" ${itemState.sort==="score-asc"?"selected":""}>sort: score ↑</option>
        <option value="age" ${itemState.sort==="age"?"selected":""}>sort: newest</option>
      </select>
    </div>
    <div class="rows" id="rows"></div>`;
  const bind=(id,key)=>{const e=$("#"+id);const ev=e.tagName==="INPUT"?"input":"change";e.addEventListener(ev,()=>{itemState[key]=e.value;renderRows();});};
  bind("q","q");bind("f-type","type");bind("f-state","state");bind("f-source","source");bind("f-sort","sort");
  renderRows();
}
function renderRows(){
  let list=DATA.items.filter(i=>{
    if(itemState.type&&i.type!==itemState.type)return false;
    if(itemState.state&&i.state!==itemState.state)return false;
    if(itemState.source&&i.source_id!==itemState.source)return false;
    if(itemState.q){const q=itemState.q.toLowerCase();
      if(!((i.title||"").toLowerCase().includes(q)||(i.source_id||"").toLowerCase().includes(q)||(i.score_why||"").toLowerCase().includes(q)))return false;}
    return true;
  });
  if(itemState.sort==="score")list=list.slice().sort((a,b)=>(b.score||0)-(a.score||0));
  else if(itemState.sort==="score-asc")list=list.slice().sort((a,b)=>(a.score||0)-(b.score||0));
  else if(itemState.sort==="age")list=list.slice().sort((a,b)=>(b.published_at||"").localeCompare(a.published_at||""));
  const rows=$("#rows");
  if(!list.length){rows.innerHTML='<div class="empty">No items match these filters.</div>';return;}
  rows.innerHTML=list.slice(0,300).map(i=>{
    const w=Math.max(2,Math.round((i.score||0)/maxScore*100));
    const titleHtml=i.url?`<a href="${esc(i.url)}" target="_blank" rel="noopener">${esc(i.title)}</a>`:esc(i.title);
    return `<div class="row">
      <div class="r-state">
        <span class="pill ${i.state}">${esc(i.state)}</span>
        ${i.cluster_size>1?`<span class="chip">×${i.cluster_size}</span>`:""}
      </div>
      <div>
        <div class="r-title">${titleHtml}</div>
        <div class="r-meta"><span class="badge ${i.type}">${esc(i.type)}</span><span>${esc(i.source_id)}</span><span>${esc(i.age)} ago</span>${i.is_primary?"":'<span>· sibling</span>'}</div>
        ${i.summary?`<div class="r-gist">${esc(i.summary)}</div>`:""}
        ${i.score_why?`<div class="r-why">${esc(i.score_why)}</div>`:""}
        ${i.snippet?`<div class="r-snip">${esc(i.snippet)}</div>`:""}
      </div>
      <div class="r-score">
        <div class="sv">${i.score==null?"—":i.score.toFixed(2)}</div>
        <div class="r-bar"><i style="width:${w}%"></i></div>
      </div>
    </div>`;
  }).join("");
  if(list.length>300)rows.insertAdjacentHTML("beforeend",`<div class="empty">showing first 300 of ${list.length}</div>`);
}

/* ---- sources ---- */
function panelSources(){
  const rows=DATA.sources.map(s=>`
    <tr>
      <td><strong>${esc(s.id)}</strong></td>
      <td><span class="badge ${s.type}">${esc(s.type)}</span></td>
      <td><div class="tags">${s.tags.map(t=>`<span class="chip">${esc(t)}</span>`).join("")}</div></td>
      <td class="num">${Number(s.weight).toFixed(1)}</td>
      <td class="num">${s.item_count}</td>
      <td><span class="pill ${s.status}">${esc(s.status)}</span></td>
      <td>${s.last_error?`<span class="err">${esc(s.last_error)}</span>`:'<span style="color:var(--muted)">—</span>'}</td>
    </tr>`).join("");
  $("#panel").innerHTML=`<div style="overflow-x:auto"><table class="tbl">
    <thead><tr><th>Source</th><th>Type</th><th>Tags</th><th>Weight</th><th>Items</th><th>Status</th><th>Last error</th></tr></thead>
    <tbody>${rows}</tbody></table></div>`;
}

/* ---- digest ---- */
function panelDigest(){
  const d=DATA.digest;
  let html="";
  if(d.overview){html+=`<div class="ov">${esc(d.overview)}</div>`;}
  html+=`<div class="sec-head" style="margin-top:4px"><h2>What ships this run</h2><span class="hint">${d.counts.news} items · ${d.counts.newsletters} newsletters</span></div>`;
  if(d.trackers&&d.trackers.length){
    html+='<div class="tracker-grid" style="margin-bottom:24px">'+d.trackers.map(t=>`
      <div class="tk"><div class="tk-label">${esc(t.label)}</div><div class="tk-value">${esc(t.value)}</div>
      ${t.spark?`<svg viewBox="0 0 110 26" preserveAspectRatio="none"><polyline points="${esc(t.spark)}" fill="none" stroke="${accent()}" stroke-width="1.5"/></svg>`:""}</div>`).join("")+"</div>";
  }
  (d.sections||[]).forEach(sec=>{
    html+=`<div class="digest-tag">${esc(sec.tag)}</div>`;
    html+=sec.entries.map(diItem).join("");
  });
  if(d.newsletters&&d.newsletters.length){html+=`<div class="digest-tag">newsletters</div>`+d.newsletters.map(diItem).join("");}
  if(d.dead_feeds&&d.dead_feeds.length){
    html+=`<div class="digest-tag" style="color:var(--crit)">dead feeds</div>`;
    html+=d.dead_feeds.map(f=>`<div class="di"><div class="di-t">${esc(f.source_id)}</div><div class="di-m err">${esc(f.error_count)} errors · ${esc(f.last_error)}</div></div>`).join("");
  }
  if(!(d.sections||[]).length && !(d.newsletters||[]).length){html+='<div class="empty">Digest window is empty right now.</div>';}
  $("#panel").innerHTML=html;
}
function diItem(it){
  const t=it.url?`<a href="${esc(it.url)}" target="_blank" rel="noopener">${esc(it.title)}</a>`:esc(it.title);
  const sib=(it.siblings&&it.siblings.length)?` · also: ${esc(it.siblings.join(", "))}`:"";
  return `<div class="di"><div class="di-t"><span class="badge ${it.source_type}">${esc(it.source_type)}</span> ${t}</div>
    <div class="di-m">${esc(it.source_id)} · ${esc(it.age)} ago${sib}</div></div>`;
}

/* ---- clusters ---- */
function panelClusters(){
  if(!DATA.clusters.length){$("#panel").innerHTML='<div class="empty">No multi-source duplicates in the current window. Level-1 (canonical-URL) dedup still ran on every item.</div>';return;}
  $("#panel").innerHTML=DATA.clusters.map(c=>`
    <div class="cluster"><div class="cl-id">cluster ${esc(c.cluster_id)} · ${c.members.length} members</div>
    ${c.members.map(m=>`<div class="cl-m ${m.is_primary?"primary":""}">${m.is_primary?"★ ":"↳ "}<span style="color:var(--muted)">[${esc(m.source_id)}]</span> ${esc(m.title)}</div>`).join("")}
    </div>`).join("");
}

/* ---- scoring ---- */
function panelScoring(){
  const s=DATA.scoring;
  const kw=s.keywords.map(([k,v])=>`<span class="kw pos"><span>${esc(k)}</span><span class="w">+${Number(v).toFixed(1)}</span></span>`).join("");
  const neg=s.negatives.map(([k,v])=>`<span class="kw neg"><span>${esc(k)}</span><span class="w">${Number(v).toFixed(1)}</span></span>`).join("");
  const knob=(l,v)=>`<div class="knob"><div class="k-l">${esc(l)}</div><div class="k-v">${esc(v)}</div></div>`;
  $("#panel").innerHTML=`
    <div class="formula">${esc(s.formula)}</div>
    <div class="sec-head"><h2>Keyword weights</h2><span class="hint">matched against title + first 500 chars · summed, capped at ${s.keyword_score_cap}</span></div>
    <div class="kw-wrap">${kw}</div>
    <div class="sec-head"><h2>Negative keywords</h2><span class="hint">demote clickbait / promo</span></div>
    <div class="kw-wrap">${neg}</div>
    <div class="sec-head"><h2>Knobs</h2><span class="hint">config.yaml</span></div>
    <div class="knobs">
      ${knob("Half-life",s.half_life_hours+"h")}
      ${knob("Dedup threshold",s.dedup_threshold)}
      ${knob("Max items",s.max_items)}
      ${knob("Dedup window",s.window_hours+"h")}
    </div>`;
}

/* ---- redraw everything that depends on the accent color (theme change) ---- */
function drawAll(){drawPipeline();drawSummary();drawTrackers();if(activeTab==="digest"||activeTab==="scoring"||activeTab==="clusters")drawPanel();}

drawHeader();drawPipeline();drawSummary();drawTrackers();drawTabs();drawPanel();
</script>

</body>
</html>
