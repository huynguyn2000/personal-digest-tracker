": "Unnest Operator Performance Enhancement with Dictionary Blocks", "url": "https://trino.io/blog/2019/08/23/unnest-operator-performance-enhancements.html", "age": "2542d", "published_at": "2019-08-23T00:00:00+00:00", "score": 0.0, "score_why": "src:1 kw:+0 rec:0.00", "state": "new", "is_primary": true, "cluster_size": 1, "snippet": "Queries with CROSS JOIN UNNEST clause are expected to have a significant performance improvement starting version 316."}, {"id": "3320b5e66a9c", "source_id": "trino-blog", "type": "rss", "title": "A Report of First Ever Presto Conference Tokyo", "url": "https://trino.io/blog/2019/07/11/report-for-presto-conference-tokyo.html", "age": "2585d", "published_at": "2019-07-11T00:00:00+00:00", "score": 0.0, "score_why": "src:1 kw:+0 rec:0.00", "state": "new", "is_primary": true, "cluster_size": 1, "snippet": "Nowadays, Presto is getting much attraction from the various kind of companies all around the world. Japan is not an exception. Many companies are using Presto as their primary dat\u2026"}, {"id": "37d28428574b", "source_id": "trino-blog", "type": "rss", "title": "Introduction to Trino Cost-Based Optimizer", "url": "https://trino.io/blog/2019/07/04/cbo-introduction.html", "age": "2592d", "published_at": "2019-07-04T00:00:00+00:00", "score": 0.0, "score_why": "src:1 kw:+1.5 rec:0.00 [trino(+1),benchmark(+0.5)]", "state": "new", "is_primary": true, "cluster_size": 1, "snippet": "Last edited 15 June 2022: Update to use the Trino project name. The Cost-Based Optimizer (CBO) in Trino achieves stunning results in industry standard benchmarks (and not only in b\u2026"}, {"id": "f994f381cd0f", "source_id": "trino-blog", "type": "rss", "title": "Dynamic filtering for highly-selective join optimization", "url": "https://trino.io/blog/2019/06/30/dynamic-filtering.html", "age": "2596d", "published_at": "2019-06-30T00:00:00+00:00", "score": 0.0, "score_why": "src:1 kw:+0 rec:0.00", "state": "new", "is_primary": true, "cluster_size": 1, "snippet": "By is_primary": true, "cluster_size": 1, "snippet": "Optimizers are all about doing work in the most cost-effective manner and avoiding unnecessary work. Some SQL constructs such as ORDER BY do not affect query results in many situat\u2026"}, {"id": "d93438582a33", "source_id": "trino-blog", "type": "rss", "title": "Release 313", "url": "https://trino.io/blog/2019/06/01/release-313.html", "age": "2625d", "published_at": "2019-06-01T00:00:00+00:00", "score": 0.0, "score_why": "src:1 kw:+0 rec:0.00", "state": "new", "is_primary": true, "cluster_size": 1, "snippet": "This version fixes incorrect results for queries involving GROUPING SETS and LIMIT, fixes selecting the UUID type from the CLI and JDBC driver, and adds support for compression and\u2026"}, {"id": "9a561e6be786", "source_id": "trino-blog", "type": "rss", "title": "Using Precomputed Hash in SemiJoin Operations", "url": "https://trino.io/blog/2019/05/30/semijoin-precomputed-hasd.html", "age": "2627d", "published_at": "2019-05-30T00:00:00+00:00", "score": 0.0, "score_why": "src:1 kw:+0 rec:0.00", "state": "new", "is_primary": true, "cluster_size": 1, "snippet": "Queries involving IN and NOT IN over a subquery are much faster in Presto 312."}, {"id": "d41c403bd143", "source_id": "trino-blog", "type": "rss", "title": "Release 312", "url": "https://trino.io/blog/2019/05/29/release-312.html", "age": "2628d", "published_at": "2019-05-29T00:00:00+00:00", "score": 0.0, "score_why": "src:1 kw:+0 rec:0.00", "state": "new", "is_primary": true, "cluster_size": 1, "snippet": "This version has many performance improvements (including cast optimization), a new UUID data type and uuid() function, a new Apache Phoenix connector, support for the PostgreSQL T\u2026"}, {"id": "b1fed7a7dddd", "source_id": "trino-blog", "type": "rss", "title": "Improved Hive Bucketing", "url": "https://trino.io/blog/2019/05/29/improved-hive-bucketing.html", "age": "2628d", "published_at": "2019-05-29T00:00:00+00:00", "score": 0.0, "score_why": "src:1 kw:+0 rec:0.00", "state": "new", "is_primary": true, "cluster_size": 1, "snippet": "Presto 312 adds support for the more flexible bucketing introduced in recent versions of Hive. Specifically, it allows any number of files per bucket, including zero. This allows i\u2026"}, {"id": "a0e5fea22a58", "source_id": "trino-blog", "type": "rss", "title": "Optimizing the Casts Away", "url": "https://trino.io/blog/2019/05/21/optimizing-the-casts-away.html", "age": "2636d", "published_at": "2019-05-21T00:00:00+00:00", "score": 0.0, "score_why": "src:1 kw:+0 rec:0.00", "state": "new", "is_primary": true, "cluster_size": 1, "snippet": "The next release of Presto (version 312) will include a new optimization to remove unnecessary casts which might have been added implicitly by the query planner or explicitly by us\u2026"}, {"id": "a99f5b73d07c", "source_id": "trino-blog", "type": "rss", "title": "Presto Summit 2019 @TwitterSF", "url": "https://trino.io/blog/2019/05/17/Presto-Summit.html", "age": "2640d", "published_at": "2019-05-17T00:00:00+00:00", "score": 0.0, "score_why": "src:1 kw:+0 rec:0.00", "state": "new", "is_primary": true, "cluster_size": 1, "snippet": "Next month will mark the 2nd annual Presto Summit hosted by the Presto Software Foundation, Starburst Data, and Twitter. Last year\u2019s event was a great success (see the Presto Summi\u2026"}, {"id": "627e56efa69b", "source_id": "trino-blog", "type": "rss", "title": "Release 311", "url": "https://trino.io/blog/2019/05/15/release-311.html", "age": "2642d", "published_at": "2019-05-15T00:00:00+00:00", "score": 0.0, "score_why": "src:1 kw:+0 rec:0.00", "state": "new", "is_primary": true, "cluster_size": 1, "snippet": "This version adds standard OFFSET syntax, a new function combinations() for computing k-combinations of array elements, and support for nested collections in Cassandra. Release not\u2026"}, {"id": "b030079b41c9", "source_id": "trino-blog", "type": "rss", "title": "Presto Community Meeting 2019-05-08", "url": "https://trino.io/blog/2019/05/08/Presto-Community-Meeting.html", "age": "2649d", "published_at": "2019-05-08T00:00:00+00:00", "score": 0.0, "score_why": "src:1 kw:+0 rec:0.00", "state": "new", "is_primary": true, "cluster_size": 1, "snippet": "Agenda Existing function support Function namespaces Connector-resolved functions SQL-defined functions Remote functions Polymorphic table functions"}, {"id": "e11d4d9fc4d8", "source_id": "trino-blog", "type": "rss", "title": "Faster S3 Reads", "url": "https://trino.io/blog/2019/05/06/faster-s3-reads.html", "age": "2651d", "published_at": "2019-05-06T00:00:00+00:00", "score": 0.0, "score_why": "src:1 kw:+0 rec:0.00", "state": "new", "is_primary": true, "cluster_size": 1, "snippet": "Presto is known for working well with Amazon S3. We recently made an improvement that greatly reduces network utilization and latency when reading ORC or Parquet data."}, {"id": "d064d80bc98e", "source_id": "trino-blog", "type": "rss", "title": "Release 310", "url": "https://trino.io/blog/2019/05/03/release-310.html", "age": "2654d", "published_at": "2019-05-03T00:00:00+00:00", "score": 0.0, "score_why": "src:1 kw:+0 rec:0.00", "state": "new", "is_primary": true, "cluster_size": 1, "snippet": "This version adds standard FETCH FIRST syntax, support for using an alternate AWS role when accessing S3 or Glue, and improved handling of DECIMAL, DOUBLE, and REAL when Hive table\u2026"}, {"id": "ffd382de50da", "source_id": "trino-blog", "type": "rss", "title": "A review of the first international Presto Conference, Tel Aviv, April 2019", "url": "https://trino.io/blog/2019/05/03/Presto-Conference-Israel.html", "age": "2654d", "published_at": "2019-05-03T00:00:00+00:00", "score": 0.0, "score_why": "src:1 kw:+0 rec:0.00", "state": "new", "is_primary": true, "cluster_size": 1, "snippet": "Community, noun: \u201cA feeling of fellowship with others, as a result of sharing common attributes, interests, and goals\u201d The fun picture you see here was taken at the first lecture o\u2026"}, {"id": "b14e53ca0b43", "source_id": "trino-blog", "type": "rss", "title": "Release 309", "url": "https://trino.io/blog/2019/04/25/release-309.html", "age": "2662d", "published_at": "2019-04-25T00:00:00+00:00", "score": 0.0, "score_why": "src:1 kw:+0 rec:0.00", "state": "new", "is_primary": true, "cluster_size": 1, "snippet": "This version adds support for case-insensitive name matching in JDBC-based connectors, more data types in PostgreSQL connector, and some bug fixes. Release notes Download"}, {"id": "dd67dd5cfcdb", "source_id": "trino-blog", "type": "rss", "title": "Even Faster ORC", "url": "https://trino.io/blog/2019/04/23/even-faster-orc.html", "age": "2664d", "published_at": "2019-04-23T00:00:00+00:00", "score": 0.0, "score_why": "src:1 kw:+1 rec:0.00 [trino(+1)]", "state": "new", "is_primary": true, "cluster_size": 1, "snippet": "Trino is known for being the fastest SQL on Hadoop engine, and our custom ORC reader implementation is a big reason for this speed \u2013 now it is even faster!"}, {"id": "0184dded795e", "source_id": "trino-blog", "type": "rss", "title": "Release 308", "url": "https://trino.io/blog/2019/04/12/release-308.html", "age": "2675d", "published_at": "2019-04-12T00:00:00+00:00", "score": 0.0, "score_why": "src:1 kw:+0 rec:0.00", "state": "new", "is_primary": true, "cluster_size": 1, "snippet": "This version includes significant performance improvements when reading ORC data, authorization checks for SHOW COLUMNS, and limit pushdown for JDBC-based connectors. Release notes\u2026"}, {"id": "7217a56e20a8", "source_id": "trino-blog", "type": "rss", "title": "Release 307", "url": "https://trino.io/blog/2019/04/08/release-307.html", "age": "2679d", "published_at": "2019-04-08T00:00:00+00:00", "score": 0.0, "score_why": "src:1 kw:+0 rec:0.00", "state": "new", "is_primary": true, "cluster_size": 1, "snippet": "This version includes some important security fixes, support for inner and outer joins involving lateral deriv const $ = (s,r=document)=>r.querySelector(s);
const root = document.documentElement;

function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}
function elFrom(html){const t=document.createElement("template");t.innerHTML=html.trim();return t.content;}

/* ---- theme ---- */
function currentTheme(){return root.getAttribute("data-theme") || (matchMedia("(prefers-color-scheme:dark)").matches?"dark":"light");}
function setTheme(t){root.setAttribute("data-theme",t);try{localStorage.setItem("pdt-theme",t);}catch(e){}drawAll();}
$("#themeBtn").addEventListener("click",()=>setTheme(currentTheme()==="dark"?"light":"dark"));
try{const s=localStorage.getItem("pdt-theme");if(s)root.setAttribute("data-theme",s);}catch(e){}

/* ---- charts ---- */
function accent(){return getComputedStyle(root).getPropertyValue("--accent").trim()||"#38cdf0";}
function areaChart(vals,w=260,h=52,pad=4){
  if(!vals||!vals.length) return "";
  if(vals.length===1){const cy=h/2;return `<svg viewBox="0 0 ${w} ${h}" preserveAspectRatio="none"><line x1="${pad}" y1="${cy}" x2="${w-pad}" y2="${cy}" stroke="var(--grid)" stroke-width="1"/><circle cx="${w-pad}" cy="${cy}" r="3.5" fill="${accent()}"/></svg>`;}
  const lo=Math.min(...vals),hi=Math.max(...vals),span=(hi-lo)||1,n=vals.length;
  const X=i=>pad+(w-2*pad)*(i/(n-1));
  const Y=v=>pad+(h-2*pad)*(1-(v-lo)/span);
  let line=vals.map((v,i)=>`${X(i).toFixed(1)},${Y(v).toFixed(1)}`).join(" ");
  let area=`${pad},${h-pad} `+line+` ${w-pad},${h-pad}`;
  const ex=X(n-1).toFixed(1),ey=Y(vals[n-1]).toFixed(1);
  const gid="g"+Math.round(X(0)+hi);
  return `<svg viewBox="0 0 ${w} ${h}" preserveAspectRatio="none">
    <defs><linearGradient id="${gid}" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="${accent()}" stop-opacity="0.22"/>
      <stop offset="1" stop-color="${accent()}" stop-opacity="0"/></linearGradient></defs>
    <line x1="${pad}" y1="${(h-pad).toFixed(1)}" x2="${w-pad}" y2="${(h-pad).toFixed(1)}" stroke="var(--grid)" stroke-width="1"/>
    <polygon points="${area}" fill="url(#${gid})"/>
    <polyline points="${line}" fill="none" stroke="${accent()}" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="${ex}" cy="${ey}" r="3.2" fill="${accent()}"/></svg>`;
}

/* ---- header / pipeline / summary ---- */
function drawHeader(){$("#gen").textContent="snapshot · "+DATA.generated;$("#foot-gen").textContent=DATA.generated;}
function drawPipeline(){
  $("#pipeline").innerHTML = DATA.pipeline.map(s=>`
    <div class="stage">
      <span class="dot"></span>
      <span class="st-label">${esc(s.label)}</span>
      <span class="st-value ${typeof s.value==="string"?"text":""}">${esc(s.value)}</span>
      <span class="st-sub">${esc(s.sub)}</span>
    </div>`).join("");
}
function drawSummary(){
  const s=DATA.summary;
  const cards=[
    {l:"Items",v:s.items_total,sub:`${s.new} new · ${s.digested} digested`},
    {l:"Sources",v:s.sources_total,sub:`${s.sources_ok} ok`},
    {l:"Dead feeds",v:s.sources_dead,sub:s.sources_dead?"needs attention":"all healthy",crit:s.sources_dead>0},
    {l:"Merged clusters",v:s.clusters_merged,sub:"near-duplicates"},
    {l:"Trackers",v:s.metrics_tracked,sub:"live metrics"},
  ];
  $("#summary").innerHTML=cards.map(c=>`
    <div class="card ${c.crit?"crit":""}">
      <div class="c-label">${esc(c.l)}</div>
      <div class="c-value">${esc(c.v)}</div>
      <div class="c-sub">${esc(c.sub)}</div>
    </div>`).join("");
}
function drawTrackers(){
  const g=$("#trackers");
  if(!DATA.metrics.length){g.innerHTML='<div class="empty">No metrics yet — run fetch_metrics.</div>';return;}
  g.innerHTML=DATA.metrics.map(m=>`
    <div class="tk">
      <div class="tk-top"><span class="tk-label">${esc(m.label)}</span><span class="tk-n">${m.n} pt${m.n>1?"s":""}</span></div>
      <div class="tk-value">${esc(m.latest)}</div>
      ${areaChart(m.points)}

}

/* ---- tabs ---- */
const TABS=[
  {k:"items",l:"Items",c:()=>DATA.items.length},
  {k:"sources",l:"Sources",c:()=>DATA.sources.length},
  {k:"digest",l:"Digest",c:()=>DATA.digest.counts.news+DATA.digest.counts.newsletters},
  {k:"clusters",l:"Clusters",c:()=>DATA.clusters.length},
  {k:"scoring",l:"Scoring",c:()=>DATA.scoring.keywords.length},
];
let activeTab="items";
function drawTabs(){
  $("#tabs").innerHTML=TABS.map(t=>`<button class="tab" role="tab" data-k="${t.k}"
     aria-selected="${t.k===activeTab}">${esc(t.l)} <span class="cnt">${t.c()}</span></button>`).join("");
  $("#tabs").querySelectorAll(".tab").forEach(b=>b.addEventListener("click",()=>{activeTab=b.dataset.k;drawTabs();drawPanel();}));
}
function drawPanel(){({items:panelItems,sources:panelSources,digest:panelDigest,clusters:panelClusters,scoring:panelScoring})[activeTab]();}

/* ---- items ---- */
let itemState={q:"",type:"",state:"",source:"",sort:"score"};
const maxScore=Math.max(1e-9,...DATA.items.map(i=>i.score||0));
function panelItems(){
  const sources=[...new Set(DATA.items.map(i=>i.source_id))].sort();
  const types=[...new Set(DATA.items.map(i=>i.type))].sort();
  const states=[...new Set(DATA.items.map(i=>i.state))].sort();
  $("#panel").innerHTML=`
    <div class="toolbar">
      <input id="q" type="search" placeholder="Search title, source, or score reason…" value="${esc(itemState.q)}">
      <select id="f-type"><option value="">all types</option>${types.map(t=>`<option ${t===itemState.type?"selected":""}>${t}</option>`).join("")}</select>
      <select id="f-state"><option value="">any state</option>${states.map(t=>`<option ${t===itemState.state?"selected":""}>${t}</option>`).join("")}</select>
      <select id="f-source"><option value="">all sources</option>${sources.map(t=>`<option ${t===itemState.source?"selected":""}>${t}</option>`).join("")}</select>
      <select id="f-sort">
        <option value="score" ${itemState.sort==="score"?"selected":""}>sort: score ↓</option>
        <option value="score-asc" ${itemState.sort==="score-asc"?"selected":""}>sort: score ↑</option>
        <option value="age" ${itemState.sort==="age"?"selected":""}>sort: newest</option>
      </select>
    </div>
    <div class="rows" id="rows"></div>`;
  const bind=(id,key)=>{const e=$("#"+id);const ev=e.tagName==="INPUT"?"input":"change";e.addEventListener(ev,()=>{itemState[key]=e.value;renderRows();});};
  bind("q","q");bind("f-type","type");bind("f-state","state");bind("f-source","source");bind("f-sort","sort");
  renderRows();
}
function renderRows(){
  let list=DATA.items.filter(i=>{
    if(itemState.type&&i.type!==itemState.type)return false;
    if(itemState.state&&i.state!==itemState.state)return false;
    if(itemState.source&&i.source_id!==itemState.source)return false;
    if(itemState.q){const q=itemState.q.toLowerCase();
      if(!((i.title||"").toLowerCase().includes(q)||(i.source_id||"").toLowerCase().includes(q)||(i.score_why||"").toLowerCase().includes(q)))return false;}
    return true;
  });
  if(itemState.sort==="score")list=list.slice().sort((a,b)=>(b.score||0)-(a.score||0));
  else if(itemState.sort==="score-asc")list=list.slice().sort((a,b)=>(a.score||0)-(b.score||0));
  else if(itemState.sort==="age")list=list.slice().sort((a,b)=>(b.published_at||"").localeCompare(a.published_at||""));
  const rows=$("#rows");
  if(!list.length){rows.innerHTML='<div class="empty">No items match these filters.</div>';return;}
  rows.innerHTML=list.slice(0,300).map(i=>{
    const w=Math.max(2,Math.round((i.score||0)/maxScore*100));
    const titleHtml=i.url?`<a href="${esc(i.url)}" target="_blank" rel="noopener">${esc(i.title)}</a>`:esc(i.title);
    return `<div class="row">
      <div class="r-state">
        <span class="pill ${i.state}">${esc(i.state)}</span>
        ${i.cluster_size>1?`<span class="chip">×${i.cluster_size}</span>`:""}
      </div>
      <div>
        <div class="r-title">${titleHtml}</div>
        <div class="r-meta"><span class="badge ${i.type}">${esc(i.type)}</span><span>${esc(i.source_id)}</span><span>${esc(i.age)} ago</span>${i.is_primary?"":'<span>· sibling</span>'}</div>
        ${i.score_why?`<div class="r-why">${esc(i.score_why)}</div>`:""}
        ${i.snippet?`<div class="r-snip">${esc(i.snippet)}</div>`:""}
      </div>
      <div class="r-score">
        <div class="sv">${i.score==null?"—":i.score.toFixed(2)}</div>
        <div class="r-bar"><i style="width:${w}%"></i></div>
      </div>
    </div>`;
  }).join("");
  if(list.length>300)rows.insertAdjacentHTML("beforeend",`<div class="empty">showing first 300 of ${list.length}</div>`);
}

/* ---- sources ---- */
function panelSources(){
  const rows=DATA.sources.map(s=>`
    <tr>
      <td><strong>${esc(s.id)}</strong></td>
      <td><span class="badge ${s.type}">${esc(s.type)}</span></td>
      <td><div class="tags">${s.tags.map(t=>`<span class="chip">${esc(t)}</span>`).join("")}</div></td>
      <td class="num">${Number(s.weight).toFixed(1)}</td>
      <td class="num">${s.item_count}</td>
      <td><span class="pill ${s.status}">${esc(s.status)}</span></td>
      <td>${s.last_error?`<span class="err">${esc(s.last_error)}</span>`:'<span style="color:var(--muted)">—</span>'}</td>
    </tr>`).join("");
  $("#panel").innerHTML=`<div style="overflow-x:auto"><table class="tbl">
    <thead><tr><th>Source</th><th>Type</th><th>Tags</th><th>Weight</th><th>Items</th><th>Status</th><th>Last error</th></tr></thead>
    <tbody>${rows}</tbody></table></div>`;
}

/* ---- digest ---- */
function panelDigest(){
  const d=DATA.digest;
  let html="";
  html+=`<div class="sec-head" style="margin-top:4px"><h2>What ships this run</h2><span class="hint">${d.counts.news} items · ${d.counts.newsletters} newsletters</span></div>`;
  if(d.trackers&&d.trackers.length){
    html+='<div class="tracker-grid" style="margin-bottom:24px">'+d.trackers.map(t=>`
      <div class="tk"><div class="tk-label">${esc(t.label)}</div><div class="tk-value">${esc(t.value)}</div>
      ${t.spark?`<svg viewBox="0 0 110 26" preserveAspectRatio="none"><polyline points="${esc(t.spark)}" fill="none" stroke="${accent()}" stroke-width="1.5"/></svg>`:""}</div>`).join("")+"</div>";
  }
  (d.sections||[]).forEach(sec=>{
    html+=`<div class="digest-tag">${esc(sec.tag)}</div>`;
    html+=sec.entries.map(diItem).join("");
  });
  if(d.newsletters&&d.newsletters.length){html+=`<div class="digest-tag">newsletters</div>`+d.newsletters.map(diItem).join("");}
  if(d.dead_feeds&&d.dead_feeds.length){
    html+=`<div class="digest-tag" style="color:var(--crit)">dead feeds</div>`;
    html+=d.dead_feeds.map(f=>`<div class="di"><div class="di-t">${esc(f.source_id)}</div><div class="di-m err">${esc(f.error_count)} errors · ${esc(f.last_error)}</div></div>`).join("");
  }
  if(!(d.sections||[]).length && !(d.newsletters||[]).length){html+='<div class="empty">Digest window is empty right now.</div>';}
  $("#panel").innerHTML=html;
}
function diItem(it){
  const t=it.url?`<a href="${esc(it.url)}" target="_blank" rel="noopener">${esc(it.title)}</a>`:esc(it.title);
  const sib=(it.siblings&&it.siblings.length)?` · also: ${esc(it.siblings.join(", "))}`:"";
  return `<div class="di"><div class="di-t"><span class="badge ${it.source_type}">${esc(it.source_type)}</span> ${t}</div>
    <div class="di-m">${esc(it.source_id)} · ${esc(it.age)} ago${sib}</div></div>`;
}

/* ---- clusters ---- */
function panelClusters(){
  if(!DATA.clusters.length){$("#panel").innerHTML='<div class="empty">No multi-source duplicates in the current window. Level-1 (canonical-URL) dedup still ran on every item.</div>';return;}
  $("#panel").innerHTML=DATA.clusters.map(c=>`
    <div class="cluster"><div class="cl-id">cluster ${esc(c.cluster_id)} · ${c.members.length} members</div>
    ${c.members.map(m=>`<div class="cl-m ${m.is_primary?"primary":""}">${m.is_primary?"★ ":"↳ "}<span style="color:var(--muted)">[${esc(m.source_id)}]</span> ${esc(m.title)}</div>`).join("")}
    </div>`).join("");
}

/* ---- scoring ---- */
function panelScoring(){
  const s=DATA.scoring;
  const kw=s.keywords.map(([k,v])=>`<span class="kw pos"><span>${esc(k)}</span><span class="w">+${Number(v).toFixed(1)}</span></span>`).join("");
  const neg=s.negatives.map(([k,v])=>`<span class="kw neg"><span>${esc(k)}</span><span class="w">${Number(v).toFixed(1)}</span></span>`).join("");
  const knob=(l,v)=>`<div class="knob"><div class="k-l">${esc(l)}</div><div class="k-v">${esc(v)}</div></div>`;
  $("#panel").innerHTML=`
    <div class="formula">${esc(s.formula)}</div>
    <div class="sec-head"><h2>Keyword weights</h2><span class="hint">matched against title + first 500 chars · summed, capped at ${s.keyword_score_cap}</span></div>
    <div class="kw-wrap">${kw}</div>
    <div class="sec-head"><h2>Negative keywords</h2><span class="hint">demote clickbait / promo</span></div>
    <div class="kw-wrap">${neg}</div>
    <div class="sec-head"><h2>Knobs</h2><span class="hint">config.yaml</span></div>
    <div class="knobs">
      ${knob("Half-life",s.half_life_hours+"h")}
      ${knob("Dedup threshold",s.dedup_threshold)}
      ${knob("Max items",s.max_items)}
      ${knob("Dedup window",s.window_hours+"h")}
    </div>`;
}

/* ---- redraw everything that depends on the accent color (theme change) ---- */
function drawAll(){drawPipeline();drawSummary();drawTrackers();if(activeTab==="digest"||activeTab==="scoring"||activeTab==="clusters")drawPanel();}

drawHeader();drawPipeline();drawSummary();drawTrackers();drawTabs();drawPanel();
</script>
