# All sources, hand-edited. Adding a source should be one line + a couple of keys.
#
# types:
#   rss     - any RSS or Atom feed
#   youtube - give channel_id; the feed URL is built for you
#   github  - a repo releases.atom feed (badged separately in the digest)
#   imap    - a Gmail label; body comes from IMAP, no URL
#
# Every source may set: tags: [..]  and  weight: <float> (defaults.weight if omitted)

defaults:
  weight: 1.0

sources:
  # --- data engineering ---------------------------------------------------
  - id: airflow-releases
    type: github
    url: https://github.com/apache/airflow/releases.atom
    tags: [dataeng, releases]
    weight: 1.4

  - id: iceberg-releases
    type: github
    url: https://github.com/apache/iceberg/releases.atom
    tags: [dataeng, lakehouse, releases]
    weight: 1.4

  - id: flink-releases
    type: github
    url: https://github.com/apache/flink/releases.atom
    tags: [dataeng, streaming, releases]
    weight: 1.2

  - id: kafka-releases
    type: github
    url: https://github.com/apache/kafka/releases.atom
    tags: [dataeng, streaming, releases]
    weight: 1.1

  - id: spark-releases
    type: github
    url: https://github.com/apache/spark/releases.atom
    tags: [dataeng, releases]
    weight: 1.1

  - id: netflix-tech
    type: rss
    url: https://netflixtechblog.com/feed
    tags: [dataeng]
    weight: 1.0

  - id: trino-blog
    type: rss
    url: https://trino.io/blog/feed.xml
    tags: [dataeng, lakehouse]

  # --- ai -----------------------------------------------------------------
  - id: simonwillison
    type: rss
    url: https://simonwillison.net/atom/everything/
    tags: [ai]
    weight: 1.0

  - id: huggingface-blog
    type: rss
    url: https://huggingface.co/blog/feed.xml
    tags: [ai]
    weight: 0.9

  # --- aws cloud ----------------------------------------------------------
  - id: aws-news
    type: rss
    url: https://aws.amazon.com/blogs/aws/feed/
    tags: [aws]
    weight: 1.2

  - id: aws-whats-new
    type: rss
    url: https://aws.amazon.com/about-aws/whats-new/recent/feed/
    tags: [aws, releases]
    weight: 1.0

  - id: aws-big-data
    type: rss
    url: https://aws.amazon.com/blogs/big-data/feed/
    tags: [aws, dataeng]
    weight: 1.1

  # --- newsletters (Gmail) ------------------------------------------------
  # Requires GMAIL_USER + GMAIL_APP_PASSWORD env vars (needs 2FA + app password).
  # 'label' is the Gmail label; nested labels use '/'.
  - id: de-weekly
    type: imap
    label: Newsletters/DEWeekly
    tags: [dataeng, newsletter]
    weight: 1.5

  # --- youtube ------------------------------------------------------------
  - id: tubakhuym-yt              # @TùBàKhuỳm — Vietnamese AI / agents
    type: youtube
    channel_id: UCLDxPaAsHbsLPMms6i4fMdw
    tags: [ai]
    weight: 1.0

  # TODO: add more channels. Paste a channel URL and it can be resolved to a
  # channel_id (the UCxxxxxxxxxxxxxxxxxxxxxx string) from the page source.
