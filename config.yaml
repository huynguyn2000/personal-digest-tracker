# Scoring weights, thresholds, timezone. Hand-tuned against real digest output.
timezone: Asia/Ho_Chi_Minh

# Public URL where out/index.html is served (GitHub Pages). Used in the Telegram
# message. Overridable at runtime via the PAGES_URL env var.
pages_url: ""

keywords:
  iceberg: 1.0
  trino: 1.0
  airflow: 0.8
  flink: 0.8
  kafka: 0.7
  duckdb: 0.7
  dbt: 0.6
  clickhouse: 0.5
  lakehouse: 1.0
  streaming: 0.5
  "data engineering": 0.8
  postmortem: 0.9
  outage: 0.7
  benchmark: 0.5
  anthropic: 0.6
  claude: 0.5
  "context engineering": 0.6
  agent: 0.3
  vietnam: 0.8

negative_keywords:
  "top 10": -1.0
  "you won't believe": -2.0
  webinar: -0.8
  sponsored: -1.5

# LLM summarization (Gemini). Ranking + dedup stay deterministic; only the
# item gists + day overview are generated. Skipped entirely if GEMINI_API_KEY
# is unset, so the pipeline still runs without it.
summarize:
  # An alias that tracks the current flash model, so an unattended daily cron
  # won't 404 when specific versions get gated/rotated. Override via GEMINI_MODEL.
  model: gemini-flash-latest
  max_gist_chars: 140

# External pages for a larger time-window view of each tracker.
tracker_links:
  usd_vnd: https://www.google.com/finance/quote/USD-VND
  cny_vnd: https://www.google.com/finance/quote/CNY-VND
  hcmc_temp: https://www.windy.com/?10.823,106.630,8
  hcmc_rain_prob: https://www.windy.com/?rain,10.823,106.630,8
  hcmc_aqi: https://aqicn.org/city/vietnam/ho-chi-minh-city/

digest:
  max_items: 12
  # Cap how many items any single source contributes to the digest, applied
  # before max_items. Keeps a high-volume source (e.g. airflow's many release
  # RCs) from crowding out low-volume ones you follow (a YouTube channel, a
  # blog). 0 disables.
  per_source_cap: 3
  half_life_hours: 36
  window_hours: 48
  dedup_threshold: 0.6
  # How far back render/notify look for candidate items (days). Keeps the digest
  # bounded even if older 'new' items linger.
  render_window_days: 4
  keyword_score_cap: 3.0
  # Section ordering in the HTML. Tags not listed fall into "other".
  section_order: [dataeng, ai]
